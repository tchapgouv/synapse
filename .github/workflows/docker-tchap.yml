# GitHub actions workflow which builds and publishes the docker images.

name: Create and publish a Docker image
on:
  push:
    branches: [develop_tchap]
    tags: ["*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build and push image for ${{ matrix.platform }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          # - linux/arm/v6
          # - linux/arm/v7
          # - linux/arm64

    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v7

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          push: true
          labels: |
            gitsha1=${{ github.sha }}
            org.opencontainers.image.version=${{ env.SYNAPSE_VERSION }}
          tags: |
            ghcr.io/tchapgouv/synapse
          file: "docker/Dockerfile-tchap"
          build-args: |
            FREEZE_ROOM_VERSION=${{ vars.FREEZE_ROOM_VERSION }}
            EMAIL_ACCOUNT_VALIDITY_VERSION=${{ vars.EMAIL_ACCOUNT_VALIDITY_VERSION }}
            ROOM_ACCESS_RULES_VERSION=${{ vars.ROOM_ACCESS_RULES_VERSION }}
            DOMAIN_RULE_CHECKER_VERSION=${{ vars.DOMAIN_RULE_CHECKER_VERSION }}
            PATCH_PUSH_RULES_VERSION=${{ vars.PATCH_PUSH_RULES_VERSION }}
            BIND_SYDENT_VERSION=${{ vars.BIND_SYDENT_VERSION }}
            THREEPID_CHECKER_VERSION=${{ vars.THREEPID_CHECKER_VERSION }}
            USERNAME_FROM_THREEPID_VERSION=${{ vars.USERNAME_FROM_THREEPID_VERSION }}
            DISPLAYNAME_FROM_EMAIL_VERSION=${{ vars.DISPLAYNAME_FROM_EMAIL_VERSION }}
            RED_LIST_VERSION=${{ vars.RED_LIST_VERSION }}
            MANAGE_LAST_ADMIN_VERSION=${{ vars.MANAGE_LAST_ADMIN_VERSION }}
            SSO_PROCONNECT_VERSION=${{ vars.SSO_PROCONNECT_VERSION }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.suffix }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY  }}/${{ env.IMAGE_NAME }}

      - name: Login
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
          $(printf '${{ env.REGISTRY  }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY  }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}